<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sopa de Letras - 100 Niveles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="menu-page level-bg-7">
    <div class="menu-wrapper">
        <div class="menu-card">
            <h1 class="logo">Sopa de Letras</h1>
            <p class="tagline">100 niveles · dificultad progresiva</p>
            <div class="mode-list">
                <a class="mode-card" href="juego.html?modo=fijo" data-mode="fijo">
                    <span class="material-icons-round mode-icon">grid_on</span>
                    <span class="mode-text">
                        <span class="mode-title">Clásico</span>
                        <span class="mode-desc">Los 100 niveles siempre iguales.</span>
                        <span class="mode-progress"></span>
                    </span>
                </a>
                <a class="mode-card mode-random" href="juego.html?modo=aleatorio" data-mode="aleatorio">
                    <span class="material-icons-round mode-icon">shuffle</span>
                    <span class="mode-text">
                        <span class="mode-title">Aleatorio</span>
                        <span class="mode-desc">Cada partida cambia las palabras y su posición.</span>
                        <span class="mode-progress"></span>
                    </span>
                </a>
            </div>
        </div>
    </div>
    <script>
        document.querySelectorAll('.mode-card').forEach(card => {
            let p = null;
            try { p = JSON.parse(localStorage.getItem('sopa-progreso-' + card.dataset.mode)); } catch (e) { /* sin datos */ }
            const stars = p ? Object.values(p.stars).reduce((a, b) => a + b, 0) : 0;
            card.querySelector('.mode-progress').textContent = p
                ? `Nivel ${p.unlocked} desbloqueado · ★ ${stars}/300`
                : 'Empieza desde el nivel 1';
        });
    </script>
</body>
</html>
